global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus itself is protected with basic auth (admin / admin), see web.yml.
scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: collector
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:9102"]
