[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-insights-backend"
dynamic = ["version"]
description = "Backend API and collector for the DevOps Insights platform."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Filcu Alexandru" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "ollama>=0.6",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "SQLAlchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
devops-insights-worker = "devops_insights.worker:main"

[tool.setuptools.dynamic]
version = { attr = "devops_insights.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
