# Argo CD Application that deploys the Helm chart to a local kind cluster.
#
# Requirements:
#   - Argo CD installed (scripts/argocd-install.sh)
#   - this repository pushed to GitHub, because Argo CD pulls from Git, not from your disk
#   - the images loaded into the cluster (make kind-load)
#
#   kubectl apply -f deploy/argocd/application-kind.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-insights
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FilcuAlexandru/devops-insights.git
    targetRevision: main
    path: deploy/helm/devops-insights
    helm:
      valueFiles:
        - values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-insights
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
