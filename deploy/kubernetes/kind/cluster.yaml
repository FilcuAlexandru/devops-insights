# Local Kubernetes cluster with every component published on its own host port.
#
#   kind create cluster --config deploy/kubernetes/kind/cluster.yaml
#
# The NodePort numbers below match deploy/helm/devops-insights/values-kind.yaml, so after
# deploying, every UI is reachable on localhost without kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-insights
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }  # web application
      - { containerPort: 30800, hostPort: 30800, protocol: TCP }  # backend API
      - { containerPort: 30300, hostPort: 30300, protocol: TCP }  # Grafana
      - { containerPort: 30900, hostPort: 30900, protocol: TCP }  # Prometheus
      - { containerPort: 30443, hostPort: 30443, protocol: TCP }  # Argo CD (https)
      - { containerPort: 31434, hostPort: 31434, protocol: TCP }  # Ollama
      - { containerPort: 30432, hostPort: 30432, protocol: TCP }  # PostgreSQL
