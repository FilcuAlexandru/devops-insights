apiVersion: v1
kind: Secret
metadata:
  name: {{ include "di.service" (dict "root" . "component" "backend") }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "di.databaseUrl" . | quote }}
  GITHUB_TOKEN: {{ .Values.collector.githubToken | quote }}
