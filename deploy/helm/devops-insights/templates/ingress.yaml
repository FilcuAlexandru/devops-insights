{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "di.fullname" . }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
  annotations:
    # The AI analysis endpoint can run for a couple of minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "di.service" (dict "root" . "component" "frontend") }}
                port:
                  name: http
{{- end }}
