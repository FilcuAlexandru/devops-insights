{{- if .Values.collector.enabled }}
{{- $component := dict "root" . "component" "collector" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "di.service" $component }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  # Exactly one collector: it owns the schedule.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "di.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "di.selector" $component | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/backend/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "di.migrateContainer" . | nindent 8 }}
      containers:
        - name: collector
          image: {{ include "di.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [python, -m, devops_insights.worker]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.collector.metricsPort }}
          env:
            {{- include "di.backendEnv" . | nindent 12 }}
            - name: COLLECTION_INTERVAL_SECONDS
              value: {{ .Values.collector.intervalSeconds | quote }}
            - name: COLLECTOR_METRICS_PORT
              value: {{ .Values.collector.metricsPort | quote }}
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "di.service" $component }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    {{- include "di.selector" $component | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.collector.metricsPort }}
      targetPort: metrics
{{- end }}
