{{- $component := dict "root" . "component" "prometheus" -}}
{{- $name := include "di.service" $component -}}
{{- $basic := printf "%s:%s" .Values.prometheus.auth.username .Values.prometheus.auth.password | b64enc -}}
{{- if .Values.prometheus.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.prometheus.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "di.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "di.selector" $component | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml .Values.prometheus.podSecurityContext | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ include "di.image" (dict "root" . "image" .Values.prometheus.image) }}
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.config.file=/etc/prometheus/web.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - name: http
              containerPort: 9090
          # The UI is protected by basic auth, so probes must authenticate too.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
              httpHeaders:
                - { name: Authorization, value: "Basic {{ $basic }}" }
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
              httpHeaders:
                - { name: Authorization, value: "Basic {{ $basic }}" }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          {{- if .Values.prometheus.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "di.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- include "di.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      {{- with .Values.prometheus.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
