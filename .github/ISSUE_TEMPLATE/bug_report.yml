name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. Open ...
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Docker Compose, Kubernetes (kind), OpenShift, Development mode]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the Platform page, or `git describe --tags`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For example `docker compose logs backend collector`.
      render: shell
