name: Release

# Publishes a release when a version tag is pushed:
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
# Use scripts/version.sh set 1.2.0 first, so the files match the tag.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Files carry the tagged version
        run: scripts/version.sh check "${{ steps.version.outputs.version }}"

      - name: Changelog has an entry for this version
        run: grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md

  test:
    name: Backend and frontend tests
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devops_insights
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d devops_insights"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://admin:admin@localhost:5432/devops_insights
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend && ruff format --check backend
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: frontend

  images:
    name: Publish ${{ matrix.component }} image
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing
      attestations: write   # build provenance
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-insights-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-insights-${{ matrix.component }}
            org.opencontainers.image.description=DevOps Insights ${{ matrix.component }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devops-insights-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devops-insights-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    name: Publish the Helm chart
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Package and push the chart (OCI)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package deploy/helm/devops-insights --version "$VERSION" --app-version "$VERSION"
          helm push "devops-insights-$VERSION.tgz" "oci://ghcr.io/$owner/charts"

  release:
    name: GitHub Release
    needs: [verify, images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's changelog entry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<NOTES

          ### Artifacts

          - Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-insights-backend:$VERSION\` and \`...-frontend:$VERSION\` (linux/amd64, linux/arm64, signed provenance and SBOM)
          - Helm chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/devops-insights --version $VERSION\`
          NOTES

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md --verify-tag
