version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    # The project targets Python 3.12; moving to another minor version is a deliberate decision.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    # The dashboards and provisioning were built and tested on these major versions and on
    # PostgreSQL 16 (matching the Helm chart). Major upgrades are done by hand, with a test.
    ignore:
      - dependency-name: grafana/grafana
        update-types: ["version-update:semver-major"]
      - dependency-name: prom/prometheus
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci" }
